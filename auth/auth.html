<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Forum Zukuk</title>
    <link rel="stylesheet" href="auth/auth.css">
</head>
<body>
    <div id="auth-container" class="auth-card">
        <h2>Bienvenue dans votre espace</h2>
        <p id="auth-subtitle">Connectez-vous pour accéder à la communauté.</p>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit" id="btn-login">Continuer</button>
        </form>

        <form id="otp-form" style="display: none;">
            <p>Un code a été envoyé par email à <strong id="otp-email"></strong></p>
            <input type="text" id="otp-code" placeholder="Code à 6 chiffres" maxlength="6" inputmode="numeric">
            <p class="hint">Code valide 5 minutes</p>
            <button type="submit" id="btn-verify">Vérifier</button>
            <button type="button" id="btn-retry" class="btn-secondary">Retour</button>
        </form>

        <div class="divider">ou</div>

        <button class="btn-google" onclick="loginWithGoogle()">Continuer avec Google</button>
        <button class="btn-school" onclick="loginWithSchool()">Portail École</button>

        <p class="auth-footer">Pas encore inscrit? <a href="/sign/sign.html">S'inscrire</a></p>
    </div>

    <script src="auth-client.js"></script>
</body>
</html>
