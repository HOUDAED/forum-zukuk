<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Forum Zukuk</title>
    <link rel="stylesheet" href="sign/sign.css">
</head>
<body>
    <div id="auth-container" class="auth-card">
        <h2>Créer mon compte</h2>
        <p id="auth-subtitle">Rejoignez notre communauté dès maintenant.</p>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="signup-form">
            <div class="form-group">
                <label for="pseudo">Pseudo</label>
                <input type="text" id="pseudo" placeholder="Votre pseudo (3-20 caractères)" required minlength="3" maxlength="20">
                <small class="hint">Visible par les autres membres</small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Email (ex: user@ecole.com)" required>
                <small class="hint">Utilisé pour la connexion et les notifications</small>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Minimum 8 caractères" required minlength="8">
                <small class="hint">Au moins 8 caractères recommandés</small>
            </div>

            <div class="form-group">
                <label for="confirm">Confirmer le mot de passe</label>
                <input type="password" id="confirm" placeholder="Confirmez votre mot de passe" required minlength="8">
            </div>
            
            <div id="password-error" class="error-inline" style="display: none;">
                Les mots de passe ne correspondent pas.
            </div>

            <button type="submit" id="btn-register">Créer mon compte</button>
        </form>

        <p class="auth-footer">Déjà inscrit? <a href="/auth/auth.html">Se connecter</a></p>
    </div>

    <script src="sign-client.js"></script>
</body>
</html>
