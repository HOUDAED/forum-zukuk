<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukuk - La communauté</title>
    <link rel="stylesheet" href="/frontend/css/board.css">
    <script>
        // Applique instantanément le thème et l'humeur avant même que la page ne charge !
        const t = localStorage.getItem('zukuk_theme') || 'glass';
        const m = localStorage.getItem('zukuk_mood') || 'calme';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-mood', m);
    </script>
    <style>
        body { overflow: auto; }

        /* ── Members grid ── */
        .network-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ── Search bar ── */
        .network-search-wrap {
            position: relative;
        }
        .network-search-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            color: #9ca3af;
            pointer-events: none;
        }
        #networkSearch {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 1.5px solid #e5e7eb;
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255,255,255,0.9);
            color: #1f2937;
            transition: border-color .2s, box-shadow .2s;
            backdrop-filter: blur(8px);
        }
        #networkSearch:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129,140,248,0.1);
        }

        /* ── Member card ── */
        .member-card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: all .3s cubic-bezier(.4,0,.2,1);
            text-decoration: none;
        }
        .member-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 12px 30px rgba(110,231,183,0.15);
            border-color: #d1fae5;
        }

        .member-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700;
            flex-shrink: 0; overflow: hidden;
        }
        .member-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .member-info { flex: 1; min-width: 0; }
        .member-name {
            font-size: 1rem; font-weight: 700; color: #1f2937;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .member-mood {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 600;
            margin-top: 4px;
        }
        .member-stats {
            display: flex; gap: 12px; margin-top: 6px;
        }
        .member-stat {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.78rem; color: #6b7280;
        }
        .member-stat svg { width: 13px; height: 13px; }

        .member-arrow {
            color: #d1d5db; flex-shrink: 0;
        }
        .member-arrow svg { width: 18px; height: 18px; }

        /* ── Loader ── */
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #e0e7ff;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Empty state ── */
        .empty-state {
            text-align: center; padding: 48px 20px; color: #9ca3af;
        }
        .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }

        /* ── Mood colors ── */
        .mood-bien     { background: #fae8ff; color: #7c3aed; }
        .mood-calme    { background: #dcfce7; color: #166534; }
        .mood-triste   { background: #dbeafe; color: #1d4ed8; }
        .mood-anxieux  { background: #f1f5f9; color: #475569; }
        .mood-colère   { background: #fef3c7; color: #92400e; }
        .mood-default  { background: #f3f4f6; color: #6b7280; }

        /* ── Members count header ── */
        .network-header-row {
            display: flex; align-items: center; justify-content: space-between;
        }
        .members-badge {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #818cf8;
        }

        /* ── Stats bar ── */
        .network-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .network-stat-card {
            background: rgba(255,255,255,0.75);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex; flex-direction: column; gap: 4px;
            border: 1px solid rgba(255,255,255,0.85);
        }
        .network-stat-value { font-size: 1.4rem; font-weight: 700; color: #1f2937; }
        .network-stat-label { font-size: 0.75rem; color: #9ca3af; font-weight: 500; }

        /* slideUp animation for new cards */
        @keyframes slideUp {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        {{ template "sidebar" . }}

        <main class="main-content">
            <div class="background-gradient" aria-hidden="true"></div>

            <div class="content-wrapper">
                <header class="header">
                    <div>
                        <h1 class="header-title">La communauté 👥</h1>
                        <p class="header-subtitle">Retrouve les membres du forum</p>
                    </div>
                </header>

                <div class="network-stats" id="networkStats">
                    <div class="network-stat-card">
                        <span class="network-stat-value" id="statMembers">—</span>
                        <span class="network-stat-label">Membres</span>
                    </div>
                    <div class="network-stat-card">
                        <span class="network-stat-value" id="statPosts">—</span>
                        <span class="network-stat-label">Posts publiés</span>
                    </div>
                    <div class="network-stat-card">
                        <span class="network-stat-value" id="statLikes">—</span>
                        <span class="network-stat-label">Likes donnés</span>
                    </div>
                </div>

                <div class="network-wrapper">
                    <div class="network-header-row">
                        <div class="section-header" style="margin-bottom:0">
                            <div class="section-indicator" style="background:#6ee7b7"></div>
                            <h2>Membres</h2>
                        </div>
                        <span class="members-badge" id="membersCount">— membres</span>
                    </div>

                    <div class="network-search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input id="networkSearch" type="text" placeholder="Rechercher un pseudo…">
                    </div>

                    <div id="membersList">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/frontend/js/network.js"></script>
</body>
</html>
