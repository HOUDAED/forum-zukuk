<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukuk - La communauté</title>
    <link rel="stylesheet" href="/frontend/css/board.css">
    <style>
        body { overflow: auto; }

        /* ── Members grid ── */
        .network-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ── Search bar ── */
        .network-search-wrap {
            position: relative;
        }
        .network-search-wrap svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            color: #9ca3af;
            pointer-events: none;
        }
        #networkSearch {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border: 1.5px solid #e5e7eb;
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: inherit;
            background: rgba(255,255,255,0.9);
            color: #1f2937;
            transition: border-color .2s, box-shadow .2s;
            backdrop-filter: blur(8px);
        }
        #networkSearch:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129,140,248,0.1);
        }

        /* ── Member card ── */
        .member-card {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: all .3s cubic-bezier(.4,0,.2,1);
            text-decoration: none;
        }
        .member-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 12px 30px rgba(110,231,183,0.15);
            border-color: #d1fae5;
        }

        .member-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700;
            flex-shrink: 0; overflow: hidden;
        }
        .member-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .member-info { flex: 1; min-width: 0; }
        .member-name {
            font-size: 1rem; font-weight: 700; color: #1f2937;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .member-mood {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 600;
            margin-top: 4px;
        }
        .member-stats {
            display: flex; gap: 12px; margin-top: 6px;
        }
        .member-stat {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.78rem; color: #6b7280;
        }
        .member-stat svg { width: 13px; height: 13px; }

        .member-arrow {
            color: #d1d5db; flex-shrink: 0;
        }
        .member-arrow svg { width: 18px; height: 18px; }

        /* ── Loader ── */
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #e0e7ff;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Empty state ── */
        .empty-state {
            text-align: center; padding: 48px 20px; color: #9ca3af;
        }
        .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }

        /* ── Mood colors ── */
        .mood-bien     { background: #fae8ff; color: #7c3aed; }
        .mood-calme    { background: #dcfce7; color: #166534; }
        .mood-triste   { background: #dbeafe; color: #1d4ed8; }
        .mood-anxieux  { background: #f1f5f9; color: #475569; }
        .mood-colère   { background: #fef3c7; color: #92400e; }
        .mood-default  { background: #f3f4f6; color: #6b7280; }

        /* ── Members count header ── */
        .network-header-row {
            display: flex; align-items: center; justify-content: space-between;
        }
        .members-badge {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #818cf8;
        }

        /* ── Stats bar ── */
        .network-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .network-stat-card {
            background: rgba(255,255,255,0.75);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex; flex-direction: column; gap: 4px;
            border: 1px solid rgba(255,255,255,0.85);
        }
        .network-stat-value { font-size: 1.4rem; font-weight: 700; color: #1f2937; }
        .network-stat-label { font-size: 0.75rem; color: #9ca3af; font-weight: 500; }

        /* slideUp animation for new cards */
        @keyframes slideUp {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-badge">
                        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="logo-badge-dot"></span>
                    </div>
                    <span class="logo-text">Zukuk</span>
                </div>
            </div>

            <nav class="sidebar-nav" style="display:flex;flex-direction:column;height:100%">
                <div style="display:flex;flex-direction:column;gap:8px">
                    <button class="nav-item" data-href="/board">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span class="nav-label">Accueil</span>
                    </button>

                    <button class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span class="nav-label">Réseau</span>
                    </button>

                    <button class="nav-item" data-href="#">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span class="nav-label">Carte</span>
                    </button>
                </div>

                <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
                    <button class="nav-item" data-href="/profile">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span class="nav-label">Profil</span>
                    </button>

                    <button class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 6.68h.09A1.65 1.65 0 0 0 9 5.17V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span class="nav-label">Paramètres</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <div class="background-gradient" style="background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 50%,#e0f2fe 100%)"></div>

            <div class="content-wrapper">
                <!-- Header -->
                <header class="header">
                    <div>
                        <h1 class="header-title">La communauté 👥</h1>
                        <p class="header-subtitle">Retrouve les membres du forum</p>
                    </div>
                </header>

                <!-- Stats rapides -->
                <div class="network-stats" id="networkStats">
                    <div class="network-stat-card">
                        <span class="network-stat-value" id="statMembers">—</span>
                        <span class="network-stat-label">Membres</span>
                    </div>
                    <div class="network-stat-card">
                        <span class="network-stat-value" id="statPosts">—</span>
                        <span class="network-stat-label">Posts publiés</span>
                    </div>
                    <div class="network-stat-card">
                        <span class="network-stat-value" id="statLikes">—</span>
                        <span class="network-stat-label">Likes donnés</span>
                    </div>
                </div>

                <!-- Section liste -->
                <div class="network-wrapper">
                    <div class="network-header-row">
                        <div class="section-header" style="margin-bottom:0">
                            <div class="section-indicator" style="background:#6ee7b7"></div>
                            <h2>Membres</h2>
                        </div>
                        <span class="members-badge" id="membersCount">— membres</span>
                    </div>

                    <!-- Barre de recherche -->
                    <div class="network-search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input id="networkSearch" type="text" placeholder="Rechercher un pseudo…">
                    </div>

                    <!-- Liste des membres -->
                    <div id="membersList">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/frontend/js/network.js"></script>
</body>
</html>
