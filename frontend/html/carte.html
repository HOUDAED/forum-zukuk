<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zukuk — Carte Ultra-Moderne</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  
  <link rel="stylesheet" href="/frontend/css/maps.css" />
</head>
<body>
  {{ template "sidebar" . }}

  <div id="app" class="split-layout">
    <aside class="panel">
      <header class="panel-header">
        <h1>Carte des activités</h1>
        <p class="muted">Design Spatial & Glassmorphism 2.0</p>
      </header>

      <section class="filters glass">
        <label class="label">Recherche</label>
        <input id="filter-text" type="search" placeholder="Filtrer les lieux..." />

        <label class="label">Catégorie</label>
        <select id="filter-category">
          <option value="0">Toutes les catégories</option>
          <option value="1">⚽ Sport</option>
          <option value="2">🧘 Relaxation</option>
          <option value="3">💬 Parole</option>
          <option value="4">🎨 Créatif</option>
          <option value="5">🤝 Social</option>
          <option value="6">🌿 Nature</option>
        </select>

        <div class="divider"></div>

        <h2>Proposer une activité</h2>
        <form id="activity-form" class="form" autocomplete="off">
          <input name="created_by" id="created_by" type="hidden" />
          <input name="latitude" id="latitude" type="hidden" />
          <input name="longitude" id="longitude" type="hidden" />
          <input name="rating" id="rating" type="hidden" value="0" />

          <label class="label">Titre de l'événement</label>
          <input name="name" id="name" type="text" placeholder="Nom de l'activité" required />

          <label class="label">Adresse (Lyon et alentours)</label>
          <input name="address" id="address" type="text" placeholder="Saisissez l'adresse..." required />

          <label class="label">Date et Heure</label>
          <div class="datetime-wrapper">
            <input name="schedule" id="schedule" type="text" placeholder="Sélectionnez une date..." required />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">
            <div>
              <label class="label">Catégorie</label>
              <select name="category_id" id="category_id" required>
                <option value="1">Sport</option>
                <option value="2">Relaxation</option>
                <option value="3">Parole</option>
                <option value="4">Créatif</option>
                <option value="5">Social</option>
                <option value="6">Nature</option>
              </select>
            </div>
            <div>
              <label class="label">Places max</label>
              <input name="max_places" id="max_places" type="number" value="10" min="1" required />
            </div>
          </div>

         <label class="label">Description</label>
          <textarea name="description" id="description" rows="3" placeholder="Décrivez l'activité..."></textarea>

          <div class="form-actions">
            <button id="create-activity" type="submit" class="btn primary">Publier l'activité</button>
            <button id="reset-form" type="button" class="btn ghost">Effacer</button>
          </div>
          
          <div id="form-msg" class="form-msg"></div>
        </form>
      </section>
    </aside>

    <main class="map-container">
      <div id="map"></div>
      <aside id="place-card" class="place-card">
        <button id="close-card" class="close">✕</button>
        <h3 id="pc-title">Titre</h3>
        <p id="pc-address" class="muted">Adresse</p>
        <p id="pc-description">Description</p>
        <p id="pc-schedule" class="muted">Horaires</p>
        <p id="pc-participants" class="muted">Inscrits</p>
        <div class="card-actions">
          <button id="join-btn" class="btn primary">S'inscrire</button>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/fr.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBMwlD_Sjr4-nd77WrR5eclnRRLJXpvlmg&libraries=places,marker&region=FR&language=fr" async defer></script>
  <script src="https://unpkg.com/@googlemaps/markerclustererplus/dist/index.min.js"></script>
  <script src="/frontend/js/map.js"></script>
</body>
</html>
