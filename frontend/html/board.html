<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukuk - Forum Bien-être</title>
    <link rel="stylesheet" href="/frontend/css/board.css">
    <script>
        // Applique instantanément le thème et l'humeur sur la racine (HTML)
        const t = localStorage.getItem('zukuk_theme') || 'glass';
        const m = localStorage.getItem('zukuk_mood') || 'calme';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-mood', m);
    </script>
</head>
<body>
    <div class="app-container">
        {{ template "sidebar" . }}

        <main class="main-content">
            <div class="background-gradient"></div>

            <div class="content-wrapper">
                <header class="header">
                    <div>
                        <h1 class="header-title">Bienvenue <span class="wave-emoji">👋</span></h1>
                        <p class="header-subtitle">Comment te sens-tu aujourd'hui ?</p>
                    </div>
                    
                    <div class="header-actions">
                        <button class="btn-icon btn-primary" id="newPostBtn" title="Nouveau post">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <button class="btn-icon btn-secondary" id="header-notif-btn" style="position: relative;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="notification-badge" id="header-notif-badge" style="display: none;">0</span>
                        </button>
                    </div>
                </header>
                {{ template "notifications" . }}

                <section class="mood-section">
                    <div class="section-header">
                        <div class="section-indicator"></div>
                        <h2>Ton humeur du jour</h2>
                    </div>
                    <div class="mood-grid" id="moodGrid"></div>
                </section>

                <section class="stats-section" id="statsSection"></section>

                <section class="discussions-section">
                    <div class="section-header-with-link">
                        <div>
                            <div class="section-indicator"></div>
                            <h2>Discussions récentes</h2>
                        </div>
                    </div>

                    <div class="search-bar">
                        <div class="search-input-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input id="boardSearch" type="text" placeholder="Rechercher un post…">
                        </div>
                        <select id="boardSort" class="board-select">
                            <option value="date">📅 Date</option>
                            <option value="likes">❤️ Likes</option>
                            <option value="comments">💬 Commentaires</option>
                        </select>
                        <select id="boardOrder" class="board-select">
                            <option value="desc">↓ Récent</option>
                            <option value="asc">↑ Ancien</option>
                        </select>
                    </div>
                    
                    <div class="discussions-list" id="discussionsList"></div>
                    <div id="posts-container" class="discussions-list"></div>

                    <div style="text-align: center; margin-top: 30px; margin-bottom: 40px;">
                        <button id="btn-load-more" class="btn-secondary" style="padding: 12px 24px; border-radius: 20px; font-weight: 600; display: none; cursor: pointer;">
                            Charger plus de discussions ⬇️
                        </button>
                    </div>
                </section>

                <div class="bottom-banner" id="quoteBanner">
                    <span class="banner-emoji">💙</span>
                    <div id="quoteLoader" class="quote-loader"></div>
                    <p class="quote-text" id="quoteText" style="display:none"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="/frontend/js/board.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(async () => {
            try {
                const res = await fetch('/api/me/dashboard-stats', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('statsSection').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-icon bg-blue-100"></div>
                            <div class="stat-info">
                                <span class="stat-value">${data.posts}</span>
                                <span class="stat-label">Posts partagés</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon bg-red-50"></div>
                            <div class="stat-info">
                                <span class="stat-value">${data.responses}</span>
                                <span class="stat-label">Réponses reçues</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon bg-purple-100"></div>
                            <div class="stat-info">
                                <span class="stat-value">${data.active_days}</span>
                                <span class="stat-label">Jours actifs</span>
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                console.error("Erreur stats :", e);
            }
        }, 500); 
    });
    </script>
</body>
</html>
