<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukuk - Forum Bien-être</title>
    <link rel="stylesheet" href="/frontend/css/board.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-badge">
                        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="logo-badge-dot"></span>
                    </div>
                    <span class="logo-text">Zukuk</span>
                </div>
            </div>

            <nav class="sidebar-nav" style="display: flex; flex-direction: column; height: 100%;">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button class="nav-item active" data-nav="Accueil">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span class="nav-label">Accueil</span>
                    </button>

                    <button class="nav-item" data-nav="Forum">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4c0-1.1.9-2 2-2h8a2 2 0 0 1 2 2v5Z"></path>
                            <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path>
                        </svg>
                        <span class="nav-label">Forum</span>
                    </button>

                    <button class="nav-item" data-nav="Carte">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span class="nav-label">Carte</span>
                    </button>
                </div>

                <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
                    <button class="nav-item" data-nav="Profil" data-href="/profile">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span class="nav-label">Profil</span>
                    </button>

                    <button class="nav-item" data-nav="Paramètres">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span class="nav-label">Paramètres</span>
                    </button>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="background-gradient"></div>

            <div class="content-wrapper">
                <header class="header">
                    <div>
                        <h1 class="header-title">Bienvenue <span class="wave-emoji">👋</span></h1>
                        <p class="header-subtitle">Comment te sens-tu aujourd'hui ?</p>
                    </div>
                    
                    <div class="header-actions">
                        <button class="btn-icon btn-primary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        
                        <button class="btn-icon btn-secondary">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span class="notification-badge">3</span>
                        </button>
                    </div>
                </header>

                <section class="mood-section">
                    <div class="section-header">
                        <div class="section-indicator"></div>
                        <h2>Ton humeur du jour</h2>
                    </div>
                    
                    <div class="mood-grid" id="moodGrid">
                    </div>
                </section>

                <section class="stats-section" id="statsSection">
                </section>

                <section class="discussions-section">
                    <div class="section-header-with-link">
                        <div>
                            <div class="section-indicator"></div>
                            <h2>Discussions récentes</h2>
                        </div>
                        <a href="#" class="see-all-link">Voir tout →</a>
                    </div>

                    <div class="discussions-list" id="discussionsList">
                    </div>
                </section>

                <div class="bottom-banner" id="quoteBanner">
                    <span class="banner-emoji">💙</span>
                    <div id="quoteLoader" class="quote-loader"></div>
                    <p class="quote-text" id="quoteText" style="display: none;"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="/frontend/js/board.js"></script>
</body>
</html>
