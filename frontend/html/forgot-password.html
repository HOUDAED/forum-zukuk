<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukuk - Mot de passe oublié</title>
    <link rel="stylesheet" href="/frontend/css/auth.css">
</head>
<body>

    <div class="bg-gradients"></div>

    <div class="header-top">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="none" fill="currentColor"/></svg>
            </div>
            Zukuk
        </div>
        <h1 class="main-title">Un petit trou de mémoire ? ✨</h1>
        <p class="sub-title">Pas de panique, ça arrive à tout le monde. Respire.</p>
    </div>

    <div class="auth-card">
        <div class="dialogue-box active">
            <div class="reassurance-text">
                <span class="breathe-indicator"></span> Prends ton temps, rien ne presse.
            </div>
            <p class="sentence">
                J'ai égaré ma clé d'accès.<br>
                Pour que l'on m'aide à rouvrir mon espace, mon adresse de contact est <input id="forgot-email" type="email" class="inline-input dynamic-width" placeholder="alex@email.com" autocomplete="off">.
            </p>

            <div class="info-box" id="forgot-message" hidden></div>

            <button class="btn-primary" id="forgot-submit">
                M'envoyer le lien 
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
            
            <div class="switch-link">
                Tu as retrouvé ta clé ? <button onclick="window.location.href='/login'">Se connecter</button>
            </div>
        </div>
    </div>

    <div class="footer-note">
        On t'écoute. Prends ton temps. <span style="color: #3b82f6;">💙</span>
    </div>

    <script src="/frontend/js/script.js"></script>
</body>
</html>
