<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zukuk - Profil Membre</title>
    <link rel="stylesheet" href="/frontend/css/board.css">
    <script>
        // Application immédiate du thème et de l'humeur
        const t = localStorage.getItem('zukuk_theme') || 'glass';
        const m = localStorage.getItem('zukuk_mood') || 'calme';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-mood', m);
    </script>
    <style>
        /* ── Layout Public Profile (Polymorphe) ── */
        body { overflow: auto; }
        .public-profile-wrapper { max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding-bottom: 40px; }
        
        .hero-card {
            background: var(--bg-element);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 28px; padding: 32px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            display: flex; align-items: center; gap: 24px;
            transition: all 0.4s ease;
        }
        .hero-avatar { 
            width: 90px; height: 90px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 32px; font-weight: 700; flex-shrink: 0; 
            overflow: hidden; border: 4px solid var(--border-color); 
            box-shadow: var(--shadow-sm); background: var(--bg-page); 
            color: var(--text-secondary);
        }
        .hero-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .hero-name { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); margin-bottom: 6px; transition: color 0.4s ease;}
        
        .hero-mood { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 12px; }
        .hero-stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .hero-stat { display: flex; flex-direction: column; align-items: center; }
        .hero-stat-value { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); }
        .hero-stat-label { font-size: 0.72rem; color: var(--text-secondary); font-weight: 500; }
        
        /* ── Grid bento ── */
        .public-bento { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        
        /* ── Post item ── */
        .public-post-item {
            background: var(--bg-element); border-radius: 16px; padding: 14px 16px;
            border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px;
            transition: transform .2s, box-shadow .2s; cursor: pointer; text-decoration: none;
        }
        .public-post-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary-color); }
        .post-item-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
        .post-item-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .post-item-tag { padding: 3px 9px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; color: white; text-transform: uppercase; }
        .post-item-stat { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--text-secondary); }
        .post-item-stat svg { width: 12px; height: 12px; }
        .post-item-date { font-size: 0.72rem; color: var(--text-secondary); margin-left: auto; }
        
        /* ── Comment item ── */
        .public-comment-item {
            background: var(--bg-element); border-radius: 14px; padding: 12px 14px;
            border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px;
            transition: transform .2s;
        }
        .public-comment-item:hover { transform: translateY(-1px); border-color: var(--primary-color); }
        .comment-on { font-size: 0.72rem; color: var(--primary-color); font-weight: 600; }
        .comment-on a { color: inherit; text-decoration: none; }
        .comment-on a:hover { text-decoration: underline; }
        .comment-text { font-size: 0.88rem; color: var(--text-primary); line-height: 1.5; }
        
        .empty { color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 24px 0; }
        
        .page-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 0; gap: 14px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Moods (Couleurs des pilules) */
        .mood-bien    { background: #fae8ff; color: #7c3aed; }
        .mood-calme   { background: #dcfce7; color: #166534; }
        .mood-triste  { background: #dbeafe; color: #1d4ed8; }
        .mood-anxieux { background: #f1f5f9; color: #475569; }
        .mood-colère  { background: #fef3c7; color: #92400e; }
        .mood-default { background: var(--bg-element-hover); color: var(--text-secondary); }
        
        @media (max-width: 640px) {
            .hero-card { flex-direction: column; text-align: center; }
            .hero-stats { justify-content: center; }
            .public-bento { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        {{ template "sidebar" . }}
        
        <main class="main-content">
            <div class="background-gradient"></div>
            
            <div class="content-wrapper">
                <header class="header" style="margin-bottom:0">
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <h1 class="header-title">Profil Membre</h1>
                        <a href="/network" style="color:var(--text-secondary); text-decoration:none; font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:6px; transition:color 0.2s;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            Retour à la communauté
                        </a>
                    </div>
                </header>
                
                <div id="publicProfileContainer">
                    <div class="page-loader">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/frontend/js/public_profile.js"></script>
</body>
</html>
