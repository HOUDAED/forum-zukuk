{{ define "notifications" }}
<div id="notif-panel" class="notif-panel" style="display: none;">
    <div class="notif-header">
        <h3>Notifications</h3>
        <button id="notif-read-all">Tout marquer comme lu</button>
    </div>
    <div id="notif-list" class="notif-list">
        <div class="spinner" style="margin: 30px auto;"></div>
    </div>
</div>

<style>
    .notif-panel {
        position: absolute;
        right: 32px;
        top: 90px;
        width: 360px;
        max-height: 450px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .notif-header {
        padding: 16px 20px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(248, 250, 252, 0.5);
    }
    .notif-header h3 { font-size: 1.1rem; font-weight: 700; color: #1e293b; margin: 0; }
    .notif-header button { font-size: 0.8rem; font-weight: 600; color: #8b5cf6; background: none; border: none; cursor: pointer; }
    .notif-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
    .notif-item { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 14px; align-items: center; text-decoration: none; transition: background 0.2s; }
    .notif-item:hover { background: #f8fafc; }
    .notif-item.unread { background: #eff6ff; }
    .notif-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
    .notif-content { font-size: 0.9rem; color: #475569; line-height: 1.4; }
    .notif-content strong { color: #1e293b; font-weight: 600; }
    .notif-time { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; font-weight: 500; }
    .notif-empty { padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 0.95rem; }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const notifBtn   = document.getElementById('header-notif-btn');
    const notifPanel = document.getElementById('notif-panel');
    const notifList  = document.getElementById('notif-list');
    const badge      = document.getElementById('header-notif-badge');

    if (!notifBtn) return;

    const loadNotifications = async () => {
        try {
            const res = await fetch('http://localhost:8081/api/notifications', { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                const notifs = data.notifications || [];
                const unreadCount = notifs.filter(n => n.is_read === 0).length;
                
                if (unreadCount > 0) {
                    badge.style.display = 'flex';
                    badge.textContent = unreadCount;
                } else {
                    badge.style.display = 'none';
                }

                if (notifs.length === 0) {
                    notifList.innerHTML = '<div class="notif-empty">Aucune notification.</div>';
                } else {
                    notifList.innerHTML = notifs.map(n => {
                        const action = n.type === 'like' ? 'a aimé votre post' : 'a commenté votre post';
                        const icon = n.type === 'like' ? '❤️' : '💬';
                        const avatar = n.actor_avatar 
                            ? (n.actor_avatar.startsWith('http') ? n.actor_avatar : `http://localhost:8081${n.actor_avatar}`) 
                            : `https://api.dicebear.com/7.x/notionists/svg?seed=${n.actor_name}&backgroundColor=eef2ff`;
                        
                        return `
                        <a href="/post/${n.post_id}" class="notif-item ${n.is_read === 0 ? 'unread' : ''}">
                            <img src="${avatar}" class="notif-avatar" alt="avatar">
                            <div style="flex:1">
                                <div class="notif-content"><strong>${n.actor_name}</strong> ${action} ${icon}</div>
                            </div>
                        </a>`;
                    }).join('');
                }
            }
        } catch(e) { console.error("Erreur notifs:", e); }
    };

    notifBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        notifPanel.style.display = notifPanel.style.display === 'none' ? 'flex' : 'none';
        if (notifPanel.style.display === 'flex') loadNotifications();
    });

    document.addEventListener('click', (e) => {
        if (notifPanel && !notifPanel.contains(e.target) && !notifBtn.contains(e.target)) {
            notifPanel.style.display = 'none';
        }
    });

    document.getElementById('notif-read-all').addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
            await fetch('http://localhost:8081/api/notifications/read', { method: 'POST', credentials: 'include' });
            badge.style.display = 'none';
            document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
        } catch(e) {}
    });

    loadNotifications();
});
</script>
{{ end }}
