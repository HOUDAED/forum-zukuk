{{ define "sidebar" }}
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo-container">
            <div class="logo-badge">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span class="logo-badge-dot"></span>
            </div>
            <span class="logo-text">Zukuk</span>
        </div>
    </div>

    <nav class="sidebar-nav" style="display:flex;flex-direction:column;height:100%">
        <div style="display:flex;flex-direction:column;gap:8px">
            <button class="nav-item {{ if eq .Active "Accueil" }}active{{ end }}" data-nav="Accueil" onclick="window.location.href='/board'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Accueil</span>
            </button>

            <button class="nav-item {{ if eq .Active "Réseau" }}active{{ end }}" data-nav="Réseau" onclick="window.location.href='/network'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span class="nav-label">Réseau</span>
            </button>

            <button class="nav-item" data-nav="Carte">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span class="nav-label">Carte</span>
            </button>
        </div>

        <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
            <button class="nav-item {{ if eq .Active "Profil" }}active{{ end }}" data-nav="Profil" onclick="window.location.href='/profile'">
                <img id="sidebar-avatar" src="https://api.dicebear.com/7.x/notionists/svg?seed=Invite&backgroundColor=eef2ff" alt="Avatar" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
                <span class="nav-label">Profil</span>
            </button>

            <button class="nav-item" data-nav="Paramètres" onclick="window.location.href='/settings'">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="nav-label">Paramètres</span>
            </button>
        </div>
    </nav>
</aside>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const apiBase = 'http://localhost:8081/api';
    const fetchOpts = { credentials: 'include' };

    try {
        // 1. Mettre à jour l'avatar dans la sidebar
        const resMe = await fetch(`${apiBase}/me`, fetchOpts);
        if (resMe.ok) {
            const user = await resMe.json();
            const avatarImg = document.getElementById('sidebar-avatar');
            if (avatarImg) {
                if (user.avatar_url) {
                    avatarImg.src = user.avatar_url.startsWith('http') ? user.avatar_url : `http://localhost:8081${user.avatar_url}`;
                } else {
                    avatarImg.src = `https://api.dicebear.com/7.x/notionists/svg?seed=${user.pseudo}&backgroundColor=eef2ff`;
                }
            }
        }

        // 2. Changer la couleur du fond selon l'humeur
        const resMood = await fetch(`${apiBase}/me/mood-history`, fetchOpts);
        if (resMood.ok) {
            const data = await resMood.json();
            if (data.history && data.history.length > 0) {
                const mood = data.history[0].mood;
                const colors = {
                    'Bien':    'linear-gradient(135deg,#fdf4ff 0%,#fae8ff 50%,#fce7f3 100%)',
                    'Calme':   'linear-gradient(135deg,#f0fdf4 0%,#dcfce7 50%,#e0f2fe 100%)',
                    'Triste':  'linear-gradient(135deg,#eff6ff 0%,#dbeafe 50%,#e0e7ff 100%)',
                    'Anxieux': 'linear-gradient(135deg,#f8fafc 0%,#f1f5f9 50%,#e2e8f0 100%)',
                    'Colère':  'linear-gradient(135deg,#fff7ed 0%,#ffedd5 50%,#fef08a 100%)',
                };
                document.querySelectorAll('.background-gradient, .bg-gradients').forEach(bg => {
                    bg.style.transition = 'background 1.5s ease-in-out';
                    bg.style.background = colors[mood] || colors['Calme'];
                });
            }
        }
    } catch(e) { console.error("Erreur Sidebar:", e); }
});
</script>
{{ end }}
